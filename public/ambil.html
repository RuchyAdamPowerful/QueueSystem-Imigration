<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Ambil Nomor — QMS Kantor Imigrasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tailwind-config.js"></script>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/shared.js"></script>
</head>
<body class="bg-slate-50">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { CATEGORIES } = window.QMS;
const DEVICE_ID_KEY = 'qms-device-id';

function getDeviceId() {
  let deviceId = localStorage.getItem(DEVICE_ID_KEY);
  if (!deviceId) {
    deviceId = window.crypto && crypto.randomUUID
      ? crypto.randomUUID()
      : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    localStorage.setItem(DEVICE_ID_KEY, deviceId);
  }
  return deviceId;
}

function AmbilPage() {
  const socketRef = useRef(null);
  const [deviceId] = useState(getDeviceId);
  const [state, setState] = useState({ tickets: [] });
  const [ticket, setTicket] = useState(null);
  const [loading, setLoading] = useState(null);
  const lastCallKeyRef = useRef(null);

  useEffect(() => {
    window.QMS.warmUpVoices();
    const socket = window.QMS.connectSocket();
    socketRef.current = socket;
    socket.on('state', setState);
    socket.emit('ticket:current', deviceId, (currentTicket) => {
      if (currentTicket) setTicket(currentTicket);
    });
    return () => socket.disconnect();
  }, [deviceId]);

  function playCallAlert(currentCall) {
    try {
      const callText = `Nomor antrean ${window.QMS.spellNumber(currentCall.number)}, silakan menuju ${window.QMS.loketLabel(currentCall.loket)}`;
      window.QMS.speak(callText);

      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (AudioCtor) {
        const ctx = new AudioCtor();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = 880;
        gain.gain.value = 0.04;
        oscillator.connect(gain);
        gain.connect(ctx.destination);
        oscillator.start();
        setTimeout(() => {
          oscillator.stop();
          ctx.close();
        }, 420);
        if (ctx.state === 'suspended') ctx.resume();
      }
    } catch (e) {
      // Browser pada ponsel mungkin membatasi suara bila belum ada interaksi pengguna.
    }
  }

  useEffect(() => {
    if (!ticket || !state.currentCall) return;
    if (state.currentCall.ticketId !== ticket.id) return;
    const callKey = `${state.currentCall.ticketId}-${state.currentCall.ts}`;
    if (lastCallKeyRef.current === callKey) return;
    lastCallKeyRef.current = callKey;
    playCallAlert(state.currentCall);
  }, [ticket, state.currentCall]);

  function ambil(category) {
    setLoading(category);
    socketRef.current.emit('ticket:add', category, deviceId, (res) => {
      setLoading(null);
      if (res && res.ok) setTicket(res.ticket);
      else alert('Gagal mengambil nomor. Coba lagi.');
    });
  }

  if (ticket) {
    const ahead = (state.tickets || []).filter(t =>
      t.status === 'waiting' && t.category === ticket.category && t.createdAt < ticket.createdAt
    ).length;
    return (
      <div className="min-h-screen flex items-center justify-center p-5 bg-passport-950 security-lines">
        <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden">
          <div className="bg-passport-900 text-white text-center py-5">
            <p className="text-[11px] tracking-[0.2em] text-passport-300">Tiket antrean Anda</p>
            <p className="font-serif text-sm mt-1">Kantor Imigrasi</p>
          </div>
          <div className="p-8 text-center border-b border-dashed border-slate-300">
            <p className="text-slate-500 text-sm mb-3">{CATEGORIES[ticket.category].name}</p>
            <p className="font-serif text-6xl font-semibold text-passport-900 tracking-wide">{ticket.number}</p>
            <div className="mt-6 inline-flex flex-col items-center bg-slate-50 rounded-xl px-6 py-3">
              <p className="text-slate-400 text-xs">Sisa antrean di depan Anda</p>
              <p className="text-3xl font-semibold text-passport-700 mt-1">{ahead}</p>
            </div>
            {state.currentCall && state.currentCall.ticketId === ticket.id && (
              <div className="mt-5 rounded-xl bg-emerald-100 border border-emerald-200 text-emerald-800 px-4 py-3 text-sm font-semibold">
                Nomor Anda sedang dipanggil.
              </div>
            )}
          </div>
          <div className="px-6 py-4 text-center text-xs text-slate-400">
            <p>{new Date(ticket.createdAt).toLocaleString('id-ID')}</p>
            <p className="mt-1">Pantau nomor Anda di layar TV ruang tunggu. Halaman ini boleh ditutup.</p>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-50 flex flex-col">
      <div className="bg-passport-950 text-white text-center py-6 px-5">
        <p className="font-serif text-xl">Kantor Imigrasi</p>
        <p className="text-passport-300 text-sm mt-1">Pilih layanan yang Anda perlukan</p>
      </div>
      <div className="flex-1 px-5 py-6 space-y-4 max-w-md w-full mx-auto">
        {Object.values(CATEGORIES).map(cat => (
          <button key={cat.code} disabled={loading !== null} onClick={() => ambil(cat.code)}
            className="w-full bg-white rounded-2xl border border-slate-200 p-5 text-left flex items-center gap-4 shadow-sm active:scale-[0.99] transition-transform disabled:opacity-50">
            <div className="w-12 h-12 shrink-0 rounded-full bg-passport-900 text-brass-400 font-serif font-semibold flex items-center justify-center text-lg">
              {cat.code}
            </div>
            <div className="flex-1">
              <p className="font-semibold text-passport-950">{cat.name}</p>
              <p className="text-slate-400 text-sm mt-0.5">{loading === cat.code ? 'Memproses…' : 'Ketuk untuk ambil nomor'}</p>
            </div>
          </button>
        ))}
      </div>
      <p className="text-center text-slate-400 text-xs pb-6 px-5">Satu tiket berlaku untuk satu kali kunjungan.</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AmbilPage />);
</script>
</body>
</html>
