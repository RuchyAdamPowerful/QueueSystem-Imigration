<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Layar Publik — QMS Kantor Imigrasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tailwind-config.js"></script>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/shared.js"></script>
</head>
<body class="bg-passport-950">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { spellNumber, speak, warmUpVoices, loketLabel } = window.QMS;

function Crest() {
  return (
    <svg width="34" height="34" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="15" cy="15" r="13.5" stroke="#d4b877" strokeWidth="1.4" />
      <path d="M15 6 L21 10 V17 C21 21 18.3 23.6 15 25 C11.7 23.6 9 21 9 17 V10 Z" stroke="#d4b877" strokeWidth="1.3" fill="none" />
      <path d="M12 15.5 L14.2 17.7 L18.3 12.8" stroke="#d4b877" strokeWidth="1.3" fill="none" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function DisplayPage() {
  const [state, setState] = useState({ recentCalls: [], currentCall: null });
  const [blink, setBlink] = useState(false);
  const [clock, setClock] = useState(new Date());
  const lastTsRef = useRef(null);

  useEffect(() => {
    warmUpVoices();
    const iv = setInterval(() => setClock(new Date()), 1000);
    const socket = window.QMS.connectSocket();
    socket.on('state', setState);
    return () => { clearInterval(iv); socket.disconnect(); };
  }, []);

  useEffect(() => {
    const call = state.currentCall;
    if (call && call.ts !== lastTsRef.current) {
      lastTsRef.current = call.ts;
      setBlink(true);
      speak(`Nomor antrean ${spellNumber(call.number)}, silakan menuju ${loketLabel(call.loket)}`);
      const to = setTimeout(() => setBlink(false), 2700);
      return () => clearTimeout(to);
    }
  }, [state.currentCall && state.currentCall.ts]);

  const call = state.currentCall;
  const history = state.recentCalls || [];

  return (
    <div className={`min-h-screen flex flex-col justify-between text-white transition-colors duration-300 ${blink ? 'blink-active' : 'bg-passport-950'} security-lines`}>
      <div className="flex items-center justify-between px-10 py-6 border-b border-white/10">
        <div className="flex items-center gap-3">
          <Crest />
          <div>
            <p className="font-serif text-lg tracking-wide">Kantor Imigrasi</p>
            <p className="text-passport-300 text-sm">Sistem antrean layanan publik</p>
          </div>
        </div>
        <div className="text-right">
          <p className="text-2xl font-mono tabular-nums">{clock.toLocaleTimeString('id-ID')}</p>
          <p className="text-passport-300 text-sm">
            {clock.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
          </p>
        </div>
      </div>

      <div className="flex-1 flex flex-col items-center justify-center px-6">
        {call ? (
          <React.Fragment>
            <p className="text-passport-300 text-lg mb-4">Nomor antrean</p>
            <p className={`font-serif font-semibold leading-none tracking-wide ${blink ? 'pulse-number' : ''}`}
               style={{ fontSize: 'min(24vw, 14rem)' }}>
              {call.number}
            </p>
            <div className={`mt-10 bg-brass-500 text-passport-950 px-12 py-5 rounded-2xl ${blink ? 'ring-ping' : ''}`}>
              <p className="text-center text-base mb-1">Menuju</p>
              <p className="text-center font-serif text-5xl font-semibold whitespace-nowrap">{loketLabel(call.loket)}</p>
            </div>
          </React.Fragment>
        ) : (
          <p className="font-serif text-4xl text-passport-400">Menunggu panggilan berikutnya…</p>
        )}
      </div>

      <div className="px-10 py-5 border-t border-white/10 flex items-center gap-8 overflow-x-auto">
        <span className="text-passport-400 text-sm shrink-0">Riwayat terakhir</span>
        {history.slice(1, 7).map((h, i) => (
          <div key={i} className="flex items-center gap-2 shrink-0 text-passport-200">
            <span className="font-serif font-semibold text-lg">{h.number}</span>
            <span className="text-xs bg-white/10 px-2 py-1 rounded">{loketLabel(h.loket)}</span>
          </div>
        ))}
        {history.length <= 1 && <span className="text-passport-500 text-sm">Belum ada.</span>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DisplayPage />);
</script>
</body>
</html>
